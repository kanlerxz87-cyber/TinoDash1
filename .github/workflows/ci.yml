name: Privacy, Link & Model Verification

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run Node Privacy, ES-Module Import, Link & Unit Test Suite
        run: npm run check
      - name: Run Python Annual Deterministic Model Rebuild & Official-Source Verification
        run: |
          python3 scripts/build_verified_model.py
          python3 scripts/verify_repo.py
