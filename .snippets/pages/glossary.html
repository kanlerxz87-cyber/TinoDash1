<div class="kicker">Glossary · plain-English definitions of every term used on this site</div>
<h1 style="margin-top:.2rem">Glossary</h1>
<input type="text" id="filter" placeholder="Filter terms…" style="width:100%;max-width:420px;margin:.4rem 0" aria-label="Filter glossary terms">
<div class="grid g2" id="gloss"></div>
<script>
const TERMS=[
["AB 1482 (Tenant Protection Act, 2019)","Statewide rent cap: 5% + regional CPI, never more than 10% per 12-month period; just-cause required after 12 months; multifamily > 15 yrs; single-family exempt with proper notice (not for corporate/REIT owners). Sunsets 2030-01-01."],
["Allowance (Prop 19)","The extra value above the parent’s factored base year value that can be excluded from reassessment: $1,044,586 for transfers 2025-02-16→2027-02-15, re-indexed biennially by BOE."],
["Alternate valuation date (IRC §2032)","Executor option to value estate assets 6 months after death instead of date of death — only if it lowers estate tax (rare here)."],
["Appreciation (nominal)","House price growth including inflation, before adjusting for purchasing power."],
["Assessment / assessed value","The taxable value the county uses for the 1% base rate — for A, ≈ $550,540 (2026-27), capped at +2%/yr by Prop 13."],
["Behavioral Health Services Tax (BHSA)","California’s +1% tax on taxable income over $1,000,000, successor to the Mental Health Services Tax (Prop 63, 2004); Form 540; whole-dollar computation; not credit-offsettable."],
["Base year value (factored)","The original Prop 13 assessment, escalated ≤2%/yr — A’s numbers: $440,300 (2014) → $550,540 (2026)."],
["Black swan","A rare, severe, high-impact event with retrospective predictability — 1929, 1987, 2000, 2008, 2020, 2022 here."],
["BoE-19-P / BOE-266","BOE-19-P: parent→child reassessment-exclusion claim (file ≤3 yrs). BOE-266: homeowners’ exemption (file ≤1 yr) — both required for Prop 19."],
["Basis (IRC §1012/§1014)","The reference value for computing gain on sale. §1014 resets basis to FMV at death — the cornerstone of “sell same year.”"],
["Cap rate","NOI ÷ price. B: ≈ 3.1–3.8%; A if rented: ≈ 0.4–0.9% at current FMV."],
["Capital gain / loss","Sale proceeds − selling costs − basis. Long-term (>1 yr): 0/15/20% federal + 3.8% NIIT; CA: ordinary rates."],
["Community property double step-up","If A is held as CA community property between spouses, both halves get a new basis at either spouse’s death — §1014(b)(6)."],
["CRT (charitable remainder trust)","Not needed here; listed because it is the usual tool when a gain cannot be avoided — usually beaten by §1014 + §121."],
["DSUE (Deceased Spousal Unused Exclusion)","The unused part of the decedent’s $15,000,000 basic exclusion that a surviving spouse can claim via portability on Form 706."],
["Distribution phase (retirement)","Not this project’s focus; relevant only to reinvested proceeds spent in drawdown."],
["Documentary transfer tax (Santa Clara)","$0.55 per $500 ($1.10 per $1,000) of consideration; Cupertino city half-rate credited — total unchanged."],
["Documentary transfer tax (SF)","$2.50 per $500 ≤$250k → $30.00 per $500 ≥$25M; bracket applies to the ENTIRE price; $1M–$5M: $3.75 per $500 = 0.75%."],
["Earnest money / escrow / contingency","Sale mechanics; not analyzed here beyond cost lines (~5.5–6% all-in drag)."],
["Estate (gross) vs taxable estate","Gross estate = everything in IRC §2031; taxable = gross − deductions (debts, expenses, transfers to surviving spouse)."],
["Estate tax (federal)","Tax on transfer at death above $15,000,000 (2026); 40% top rate. CA: none."],
["Effective tax rate","Total bill ÷ assessed value — A: ≈ 1.34%; B: ≈ 2.14% (includes fixed levies)."],
["Escape assessment","Assessor’s correction bill for an omitted/understated value — protest window applies; can follow a missed Prop 19 claim."],
["Exchange (§1031)","Like-kind exchange deferring gain; requires investment property, 45-day identification, 180-day closing; incompatible with the Treasury ladder."],
["Fair market value (FMV)","Price between willing buyer/seller; the number the appraiser certifies at date of death."],
["Form 541 / 706 / 709","541: CA fiduciary income tax (trust). 706: federal estate tax + portability. 709: gift tax (lifetime taxable gifts)."],
["Gross estate","All property includable at death incl. life insurance with incidents of ownership and lifetime adjusted taxable gifts (IRC §§2031, 2001(b))."],
["Homeowners’ exemption","$7,000 reduction in assessed value (≈ $70/yr) — required evidence of occupancy for Prop 19."],
["Imputed rent","The rent an owner-occupant would pay if renting elsewhere — the housing “service” value of living in A vs SF’s B unit."],
["Inter vivos trust","A trust created during life; A is likely held in one — distribution skips probate."],
["IRC §1014 / §121 / §1250 / §1411","§1014: basis at death = FMV. §121: principal-residence gain exclusion $250k/$500k. §1250: unrecaptured depreciation gain ≤25%. §1411: 3.8% net investment income tax."],
["Ladder (Treasury)","Buying 3M/6M/1Y/2Y T-bills/notes maturing in sequence — collapses reinvestment shocks and provides cash for phased entry."],
["Law Tracker (this site)","The enacted-vs-proposed register; quarterly verification checklist."],
["Liquidity","Speed/certainty of converting to cash without discount; real estate: months, stocks: seconds."],
["Market crash / correction / bear market","−10% correction; −20%+ bear; −40%+ systemic (GFC-class)."],
["Monte Carlo simulation","Randomized projection of return paths (here: 2,000 lognormal paths) to show outcome ranges, not single lines."],
["NOI (net operating income)","Rent − opex (excluding debt service). B: ≈ $55,000–$69,000/yr; cap ≈ 3.1–3.8%."],
["NIIT (Net Investment Income Tax)","+3.8% federal on investment income over MAGI $200k single / $250k MFJ (not indexed)."],
["One Big Beautiful Bill Act (OBBBA)","Pub. L. 119-21 (2025-07-04): estate exclusion $15M 2026; permanent TCJA rates; §199A permanent."],
["Owner-occupied","Property used as the owner’s principal residence — required for Prop 19, §121, and the $7,000 homeowners’ exemption."],
["Phase-in / dollar-cost entry","Investing proceeds in tranches over 24–36 months instead of one lump — the anti-sequence-of-returns structure."],
["Portability (DSUE)","Carrying the decedent’s unused basic exclusion to the surviving spouse; needs Form 706."],
["Principal residence","The home one actually lives in (bedroom, bills, DL address, voter registration, mail) — not a label one chooses."],
["Proposition 13 (1978)","1% ad valorem + voter debt; ≤2%/yr assessed escalation; assessed value changes only on change of ownership or new construction."],
["Proposition 19 (2020)","Parent→child principal-residence reassessment exclusion; occupancy ≤1 yr; claim ≤3 yrs; value cap = base + $1,044,586 (indexed)."],
["Prop H (SF, Nov 2026)","“Stronger Muni” parcel tax 2027–2042; multi-unit ≈ $249 + $0.195/sqft >5,000; 65+ principal-residence exemption; ≤$65/unit pass-through."],
["Prop I (SF, Nov 2026)","Transfer-tax revenue-dedication measure — FAILED (51.62% no); rates unchanged (5.5%/6.0% tiers stand)."],
["Recording fee","County fee to record documents (~$30–$60 typical) — distinct from transfer tax."],
["Reassessment","Resetting the assessed value to FMV on a change of ownership; “partial” when Prop 19’s allowance applies."],
["Reinvestment risk","The risk that maturing cash/ladder rungs reinvest at lower yields — pre-priced into the IPS; shown beside every ladder headline."],
["Rent control (SF)","Cap on annual increases for pre-6/13/1979 multi-unit buildings: +1.6% (2026-27); just-cause; vacancy decontrol on voluntary turnover."],
["Secured tax bill","Annual county bill (Nov 1 / Feb 1 installments); first installment delinquent Dec 10; second Apr 10."],
["Sequence of returns risk","The danger that bad returns arrive early in an investment horizon — fatal for lump sums at market tops; neutralized by laddering."],
["Supplemental assessment","One-time prorated bill after a reassessment event — expect ≈ 4–12 months after death/transfer."],
["Step-up in basis (§1014)","Basis = FMV at death; pre-death appreciation disappears for income tax; not an estate-tax benefit, an income-tax one."],
["Supplemental / escape assessment","Corrections to the roll; escape assessments can assess up to 4 prior years + interest."],
["Tax Rate Area (TRA)","County code identifying the taxing districts for a parcel — drives the exact secured rate; B4 in <a href='questions.html'>Questions</a>."],
["Transfer (change of ownership)","Any sale, gift, or inherited transfer that can trigger reassessment; trust distributions at death are excluded from the exclusion (Prop 13) but FMV resets for non-qualifying transfers."],
["Unrecaptured §1250 gain","Depreciation-related gain taxed at up to 25% — only post-death depreciation for the heir."],
["Vacancy decontrol (Costa-Hawkins)","When a rent-controlled tenant voluntarily leaves, the landlord may reset to market — B’s biggest value lever."],
["Wealth tax proposals (dead)","AB 259/ACA 3/ACA 8 etc. — CA net-worth tax bills; never qualified/enacted; track, don’t model."],
];
const gloss=document.getElementById('gloss');
const render=(q)=>{
  gloss.innerHTML='';
  TERMS.filter(([t,d])=>!q||t.toLowerCase().includes(q)||d.toLowerCase().includes(q))
       .forEach(([t,d])=>{const div=document.createElement('div');div.className='card';div.style.margin=0;div.innerHTML=`<div class="kicker" style="color:var(--accent2)">TERM</div><h3 style="margin:.15rem 0">${t}</h3><div class="small" style="color:var(--ink2)">${d}</div>`;gloss.appendChild(div);});
  if(!gloss.children.length) gloss.innerHTML='<div class="card">No matches.</div>';
};
document.getElementById('filter').addEventListener('input',e=>render(e.target.value.trim().toLowerCase()));
render('');
</script>
